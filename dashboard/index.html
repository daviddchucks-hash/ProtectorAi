<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beast AI — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css?v=2.1.0">
</head>
<body>
  <div class="auth-bg">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">Beast<span class="logo-accent">AI</span></span>
        <span class="logo-version">v2</span>
      </div>
      <p class="auth-tagline">Security monitoring for every website you own.</p>

      <!-- Tab switcher -->
      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">Sign In</button>
        <button class="tab-btn" data-tab="register">Create Account</button>
      </div>

      <!-- Login form -->
      <form id="login-form" class="auth-form">
        <div class="field-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="field-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <div id="login-error" class="auth-error hidden"></div>
        <button type="submit" class="btn-primary" id="login-btn">
          <span class="btn-text">Sign In</span>
          <span class="btn-spinner hidden"></span>
        </button>
      </form>

      <!-- Register form -->
      <form id="register-form" class="auth-form hidden">
        <div class="field-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="field-group">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="At least 6 characters" required autocomplete="new-password">
        </div>
        <div class="field-group">
          <label>Confirm Password</label>
          <input type="password" id="reg-confirm" placeholder="Repeat password" required autocomplete="new-password">
        </div>
        <div id="reg-error" class="auth-error hidden"></div>
        <button type="submit" class="btn-primary" id="reg-btn">
          <span class="btn-text">Create Account</span>
          <span class="btn-spinner hidden"></span>
        </button>
      </form>

      <p class="auth-footer">
        Beast AI monitors your websites for threats in real time.
      </p>
    </div>

    <!-- Animated background orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>
  </div>

  <script src="config.js?v=2.1.0"></script>
  <script src="js/auth.js?v=2.1.0"></script>
</body>
</html>
