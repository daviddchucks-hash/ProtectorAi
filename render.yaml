# render.yaml — Beast AI v2 Render deployment config
# Docs: https://render.com/docs/yaml-spec

services:
  - type: web
    name: beast-ai
    env: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "200"
      # ── RENDER_URL ──────────────────────────────────────────────
      # Set this manually in the Render dashboard to your full service URL,
      # e.g. https://protectorai-1.onrender.com  (include https://)
      #
      # This is used in TWO critical places:
      #   1. Injected into beast.js as the backend URL so monitored websites
      #      know where to send events.
      #   2. Added to the Socket.IO CORS whitelist so the dashboard can
      #      receive real-time events.
      #
      # Without this set correctly, the SDK will generate invalid request URLs
      # and real-time updates will be blocked.
      - key: RENDER_URL
        sync: false
