# render.yaml — Beast AI v2 Render deployment config
# Docs: https://render.com/docs/yaml-spec

services:
  - type: web
    name: beast-ai
    env: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "200"
      - key: RENDER_URL
        fromService:
          name: beast-ai
          type: web
          property: host
